name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @togato/shared
      - run: npm test -w @togato/shared
      - run: npx tsc --noEmit
        working-directory: apps/api
      - run: npx next build
        working-directory: apps/web
